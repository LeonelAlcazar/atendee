<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .d { font-family: 'Instrument Sans', Arial, Helvetica, sans-serif; }
    .b { font-family: 'Inter Tight', Arial, Helvetica, sans-serif; }
    .m { font-family: 'IBM Plex Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#141414" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F8F5EF"/>
  <rect width="716" height="630" fill="url(#grid)"/>

  <!-- Brand -->
  <rect x="64" y="58" width="56" height="56" rx="9" fill="#141414" transform="translate(4 4)"/>
  <rect x="64" y="58" width="56" height="56" rx="9" fill="#E6482C" stroke="#141414" stroke-width="3"/>
  <text class="d" x="92" y="98" text-anchor="middle" font-size="31" font-weight="700" fill="#141414">A</text>
  <text class="d" x="136" y="99" font-size="40" font-weight="600" letter-spacing="-1.6" fill="#141414">atende<tspan fill="#E6482C">.</tspan></text>

  <!-- Headline -->
  <text class="d" x="62" y="238" font-size="66" font-weight="600" letter-spacing="-2.8" fill="#141414">Bot de WhatsApp que</text>
  <text class="d" x="62" y="310" font-size="66" font-weight="600" letter-spacing="-2.8" fill="#E6482C">reserva, cotiza y</text>
  <text class="d" x="62" y="382" font-size="66" font-weight="600" letter-spacing="-2.8" fill="#E6482C">toma pedidos.</text>

  <text class="b" x="64" y="450" font-size="27" fill="#68615A">Conectado a tu agenda o a tu sistema,</text>
  <text class="b" x="64" y="486" font-size="27" fill="#68615A">con una conexión que armamos a pedido.</text>

  <text class="m" x="64" y="570" font-size="17" font-weight="500" letter-spacing="1.2" fill="#141414">WWW.ATENDE.COM.AR · CÓRDOBA, ARGENTINA</text>

  <!-- Finished task -->
  <rect x="716" width="484" height="630" fill="#0F3D2E"/>
  <rect x="714" width="3" height="630" fill="#141414"/>

  <rect x="772" y="58" width="372" height="404" rx="11" fill="#E6482C" transform="translate(9 9)"/>
  <rect x="772" y="58" width="372" height="404" rx="11" fill="#FFFDF8" stroke="#141414" stroke-width="3"/>

  <rect x="796" y="86" width="268" height="72" rx="8" fill="#F8F5EF" stroke="#141414" stroke-width="2.5"/>
  <text class="b" x="814" y="116" font-size="21" font-weight="500" fill="#141414">Quiero un turno para corte</text>
  <text class="b" x="814" y="143" font-size="21" font-weight="500" fill="#141414">el jueves a la tarde</text>

  <rect x="836" y="172" width="284" height="72" rx="8" fill="#0F3D2E" stroke="#141414" stroke-width="2.5"/>
  <text class="b" x="854" y="202" font-size="21" font-weight="500" fill="#F8F5EF">Tengo jueves 16:00 o 17:30.</text>
  <text class="b" x="854" y="229" font-size="21" font-weight="500" fill="#F8F5EF">¿Cuál te queda mejor?</text>

  <rect x="796" y="258" width="104" height="46" rx="8" fill="#F8F5EF" stroke="#141414" stroke-width="2.5"/>
  <text class="b" x="814" y="288" font-size="21" font-weight="500" fill="#141414">A las 16</text>

  <rect x="836" y="318" width="284" height="72" rx="8" fill="#0F3D2E" stroke="#141414" stroke-width="2.5"/>
  <text class="b" x="854" y="348" font-size="21" font-weight="500" fill="#F8F5EF">Listo, te reservé el jueves</text>
  <text class="b" x="854" y="375" font-size="21" font-weight="500" fill="#F8F5EF">a las 16:00.</text>

  <g transform="rotate(-1.6 960 470)">
    <rect x="776" y="428" width="384" height="92" rx="8" fill="#141414" transform="translate(7 7)"/>
    <rect x="776" y="428" width="384" height="92" rx="8" fill="#FFFDF8" stroke="#141414" stroke-width="3"/>
    <path d="M784 429.5h56v89h-56a6.5 6.5 0 0 1-6.5-6.5v-76a6.5 6.5 0 0 1 6.5-6.5z" fill="#CDEEE5"/>
    <path d="M840 430v88" stroke="#141414" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M797 474l10 10 19-20" fill="none" stroke="#141414" stroke-width="5"/>
    <text class="d" x="858" y="469" font-size="29" font-weight="700" letter-spacing="-.6" fill="#141414">Turno reservado</text>
    <text class="b" x="858" y="497" font-size="17.5" fill="#68615A">Jueves 16:00 · conectado a tu agenda</text>
  </g>

  <text class="b" x="772" y="572" font-size="20" fill="#F8F5EF" fill-opacity=".85">Ejemplo ilustrativo</text>
</svg>
